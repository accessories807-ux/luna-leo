<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA&LEO MARKET</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .logo span {
      color: #d4af37;
    }

    header p {
      color: #ccc;
      margin-bottom: 0;
    }

    .buttons {
      text-align: center;
      padding: 20px 10px;
      background: white;
    }

    button {
      border: 0;
      padding: 13px 22px;
      margin: 5px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: #111;
      color: white;
    }

    .register {
      background: #d4af37;
      color: #111;
    }

    .search {
      padding: 20px 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    .search input {
      max-width: 650px;
      display: block;
      margin: auto;
    }

    section {
      padding: 20px 15px;
    }

    h2 {
      text-align: center;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 700px;
      margin: auto;
    }

    .category {
      background: white;
      padding: 25px 10px;
      text-align: center;
      border-radius: 12px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .empty {
      background: white;
      max-width: 650px;
      margin: auto;
      padding: 30px 20px;
      text-align: center;
      border-radius: 12px;
      color: #777;
    }

    footer {
      margin-top: 30px;
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 10px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 15px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .close {
      background: #ddd;
      color: #222;
    }

    .submit {
      background: #111;
      color: white;
      width: 100%;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    LUNA<span>&</span>LEO
  </div>

  <p>
    سوقك الإلكتروني لعرض وبيع المنتجات
  </p>
</header>

<div class="buttons">
  <button class="login" onclick="openLogin()">
    👤 تسجيل الدخول
  </button>

  <button class="register" onclick="openRegister()">
    ➕ إنشاء حساب
  </button>
</div>

<div class="search">
  <input
    type="text"
    placeholder="🔎 ابحث عن منتج..."
  >
</div>

<section>
  <h2>الأقسام</h2>

  <div class="categories">

    <div class="category">👜 إكسسوارات</div>

    <div class="category">⌚ ساعات</div>

    <div class="category">📱 إلكترونيات</div>

    <div class="category">👕 ملابس</div>

  </div>
</section>

<section>

  <h2>🛍️ أحدث المنتجات</h2>

  <div class="empty">

    <h3>لا توجد منتجات حتى الآن</h3>

    <p>
      كن أول شخص يعرض منتجه على LUNA&LEO MARKET
    </p>

  </div>

</section>

<footer>
  © 2026 LUNA&LEO MARKET
  <br><br>
  جميع الحقوق محفوظة
</footer>


<!-- نافذة التسجيل -->

<div class="modal" id="registerModal">

  <div class="modal-box">

    <h2>إنشاء حساب</h2>

    <input
      type="text"
      placeholder="الاسم"
    >

    <input
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      type="password"
      placeholder="كلمة المرور"
    >

    <button class="submit">
      إنشاء الحساب
    </button>

    <button class="close" onclick="closeRegister()">
      إغلاق
    </button>

  </div>

</div>


<!-- نافذة تسجيل الدخول -->

<div class="modal" id="loginModal">

  <div class="modal-box">

    <h2>تسجيل الدخول</h2>

    <input
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      type="password"
      placeholder="كلمة المرور"
    >

    <button class="submit">
      تسجيل الدخول
    </button>

    <button class="close" onclick="closeLogin()">
      إغلاق
    </button>

  </div>

</div>


<script>

function openRegister() {
  document.getElementById("registerModal").style.display = "flex";
}

function closeRegister() {
  document.getElementById("registerModal").style.display = "none";
}

function openLogin() {
  document.getElementById("loginModal").style.display = "flex";
}

function closeLogin() {
  document.getElementById("loginModal").style.display = "none";
}

</script>

</html>
