<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA&LEO</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 35px 15px;
      background: #000;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #ccc;
      margin-top: 10px;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: white;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    section {
      padding: 45px 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      background: #1d1d1d;
      border-radius: 15px;
    }

    footer {
      padding: 20px;
      background: #000;
      color: #aaa;
    }

</head>

<body>

  <header>
    <h1>LUNA&LEO</h1>

    <a class="btn" href="#about">اكتشف المتجر</a>
  </header>

  <section id="about">
    <div class="card">
      <h2>أهلاً بك في LUNA&LEO</h2>
      <p>
        نقدم لك مجموعة مميزة من الإكسسوارات والمنتجات
        بتصميم عصري وجودة مميزة.
      </p>
    </div>
  </section>

  <footer>
    © 2026 LUNA&LEO - جميع الحقوق محفوظة
  </footer>

</body>
</html>
