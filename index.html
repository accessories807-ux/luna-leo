<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA&LEO MARKET</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .logo span {
      color: #d4af37;
    }

    header p {
      color: #ccc;
      margin-bottom: 0;
    }

    .buttons {
      text-align: center;
      padding: 20px 10px;
      background: white;
    }

    button {
      border: 0;
      padding: 13px 22px;
      margin: 5px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: #111;
      color: white;
    }

    .register {
      background: #d4af37;
      color: #111;
    }

    .logout {
      background: #c0392b;
      color: white;
    }

    .search {
      padding: 20px 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    .search input {
      max-width: 650px;
      display: block;
      margin: auto;
    }

    section {
      padding: 20px 15px;
    }

    h2 {
      text-align: center;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 700px;
      margin: auto;
    }

    .category {
      background: white;
      padding: 25px 10px;
      text-align: center;
      border-radius: 12px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .empty {
      background: white;
      max-width: 650px;
      margin: auto;
      padding: 30px 20px;
      text-align: center;
      border-radius: 12px;
      color: #777;
    }

    footer {
      margin-top: 30px;
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 10px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 15px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .close {
      background: #ddd;
      color: #222;
    }

    .submit {
      background: #111;
      color: white;
      width: 100%;
    }

    .message {
      text-align: center;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      display: none;
      font-weight: bold;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    #userBox {
      display: none;
      text-align: center;
      background: #fff;
      padding: 15px;
    }

    #userEmail {
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    LUNA<span>&</span>LEO
  </div>

  <p>
    سوقك الإلكتروني لعرض وبيع المنتجات
  </p>
</header>


<div class="buttons" id="authButtons">

  <button class="login" onclick="openLogin()">
    👤 تسجيل الدخول
  </button>

  <button class="register" onclick="openRegister()">
    ➕ إنشاء حساب
  </button>

</div>


<div id="userBox">

  👋 أهلاً بك
  <span id="userEmail"></span>

  <br>

  <button class="logout" onclick="logout()">
    🚪 تسجيل الخروج
  </button>

</div>


<div class="search">

  <input
    type="text"
    placeholder="🔎 ابحث عن منتج..."
  >

</div>


<section>

  <h2>الأقسام</h2>

  <div class="categories">

    <div class="category">👜 إكسسوارات</div>

    <div class="category">⌚ ساعات</div>

    <div class="category">📱 إلكترونيات</div>

    <div class="category">👕 ملابس</div>

  </div>

</section>


<section>

  <h2>🛍️ أحدث المنتجات</h2>

  <div class="empty">

    <h3>لا توجد منتجات حتى الآن</h3>

    <p>
      كن أول شخص يعرض منتجه على LUNA&LEO MARKET
    </p>

  </div>

</section>


<footer>

  © 2026 LUNA&LEO MARKET

  <br><br>

  جميع الحقوق محفوظة

</footer>


<!-- نافذة إنشاء الحساب -->

<div class="modal" id="registerModal">

  <div class="modal-box">

    <h2>➕ إنشاء حساب</h2>

    <input
      type="text"
      id="registerName"
      placeholder="الاسم"
    >

    <input
      type="email"
      id="registerEmail"
      placeholder="البريد الإلكتروني"
    >

    <input
      type="password"
      id="registerPassword"
      placeholder="كلمة المرور"
    >

    <div id="registerMessage" class="message"></div>

    <button
      class="submit"
      onclick="registerUser()"
    >
      إنشاء الحساب
    </button>

    <button
      class="close"
      onclick="closeRegister()"
    >
      إغلاق
    </button>

  </div>

</div>


<!-- نافذة تسجيل الدخول -->

<div class="modal" id="loginModal">

  <div class="modal-box">

    <h2>👤 تسجيل الدخول</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="البريد الإلكتروني"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="كلمة المرور"
    >

    <div id="loginMessage" class="message"></div>

    <button
      class="submit"
      onclick="loginUser()"
    >
      تسجيل الدخول
    </button>

    <button
      class="close"
      onclick="closeLogin()"
    >
      إغلاق
    </button>

  </div>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://zuljqdzinbndmesbarjn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_thb5jIXk2pFDqs79kJMQRQ_N-HrFAt6";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* فتح وغلق النوافذ */

function openRegister() {

  document.getElementById("registerModal").style.display = "flex";

}

function closeRegister() {

  document.getElementById("registerModal").style.display = "none";

}

function openLogin() {

  document.getElementById("loginModal").style.display = "flex";

}

function closeLogin() {

  document.getElementById("loginModal").style.display = "none";

}


/* رسالة */

function showMessage(id, text, type) {

  const box = document.getElementById(id);

  box.innerText = text;

  box.className = "message " + type;

  box.style.display = "block";

}


/* إنشاء حساب */

async function registerUser() {

  const name =
    document.getElementById("registerName").value.trim();

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;


  if (!name || !email || !password) {

    showMessage(
      "registerMessage",
      "من فضلك املأ جميع البيانات",
      "error"
    );

    return;

  }


  if (password.length < 6) {

    showMessage(
      "registerMessage",
      "كلمة المرور لازم تكون 6 أحرف على الأقل",
      "error"
    );

    return;

  }


  const { data, error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {

        data: {
          name: name
        }

      }

    });


  if (error) {

    showMessage(
      "registerMessage",
      "❌ " + error.message,
      "error"
    );

    return;

  }


  showMessage(
    "registerMessage",
    "✅ تم إنشاء الحساب بنجاح",
    "success"
  );


  document.getElementById("registerName").value = "";
  document.getElementById("registerEmail").value = "";
  document.getElementById("registerPassword").value = "";

}


/* تسجيل الدخول */

async function loginUser() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  if (!email || !password) {

    showMessage(
      "loginMessage",
      "من فضلك اكتب البريد وكلمة المرور",
      "error"
    );

    return;

  }


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    showMessage(
      "loginMessage",
      "❌ البريد أو كلمة المرور غير صحيحة",
      "error"
    );

    return;

  }


  showMessage(
    "loginMessage",
    "✅ تم تسجيل الدخول بنجاح",
    "success"
  );


  setTimeout(() => {

    closeLogin();

    updateUserInterface();

  }, 800);

}


/* تسجيل الخروج */

async function logout() {

  await supabaseClient.auth.signOut();

  updateUserInterface();

}


/* معرفة المستخدم الحالي */

async function updateUserInterface() {

  const { data } =
    await supabaseClient.auth.getUser();

  const user = data.user;


  if (user) {

    document.getElementById("authButtons").style.display = "none";

    document.getElementById("userBox").style.display = "block";

    document.getElementById("userEmail").innerText =
      user.email;

  } else {

    document.getElementById("authButtons").style.display = "block";

    document.getElementById("userBox").style.display = "none";

  }

}


/* عند فتح الموقع */

updateUserInterface();

</script>

</body>
</html>
