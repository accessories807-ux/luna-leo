<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUNA&LEO MARKET</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      color: #d4af37;
    }

    .top-text {
      color: #ccc;
      margin: 8px 0 0;
      font-size: 14px;
    }

    .search-box {
      padding: 20px 15px;
      background: white;
    }

    .search {
      width: 100%;
      max-width: 600px;
      display: block;
      margin: auto;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 13px 20px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .login {
      background: #111;
      color: white;
    }

    .add {
      background: #d4af37;
      color: #111;
    }

    .categories {
      padding: 20px 15px;
    }

    .categories h2 {
      text-align: center;
      margin-bottom: 18px;
    }

    .category-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 700px;
      margin: auto;
    }

    .category {
      background: white;
      padding: 22px 10px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      font-weight: bold;
    }

    .products {
      padding: 20px 15px 40px;
    }

    .products h2 {
      text-align: center;
    }

    .empty {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      padding: 30px 20px;
      border-radius: 12px;
      text-align: center;
      color: #777;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 15px;
      font-size: 14px;
    }

    @media (min-width: 700px) {
      .category-list {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      LUNA<span>&</span>LEO
    </div>

    <p class="top-text">
      سوقك الإلكتروني لعرض وبيع المنتجات
    </p>
  </header>

  <div class="search-box">
    <input
      class="search"
      type="text"
      placeholder="🔎 ابحث عن منتج..."
    >
  </div>

  <div class="buttons">
    <button class="btn login">
      👤 تسجيل الدخول
    </button>

    <button class="btn add">
      ➕ أضف منتجك
    </button>
  </div>

  <section class="categories">
    <h2>الأقسام</h2>

    <div class="category-list">

      <div class="category">
        👜 إكسسوارات
      </div>

      <div class="category">
        ⌚ ساعات
      </div>

      <div class="category">
        📱 إلكترونيات
      </div>

      <div class="category">
        👕 ملابس
      </div>

    </div>
  </section>

  <section class="products">

    <h2>🛍️ أحدث المنتجات</h2>

    <div class="empty">
      <h3>لا توجد منتجات حتى الآن</h3>

      <p>
        كن أول شخص يعرض منتجه على LUNA&LEO MARKET
      </p>

    </div>

  </section>

  <footer>
    © 2026 LUNA&LEO MARKET
    <br><br>
    جميع الحقوق محفوظة
  </footer>

</body>
</html>
