<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA&LEO MARKET</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .logo span {
      color: #d4af37;
    }

    header p {
      color: #ccc;
      margin-bottom: 0;
    }

    .buttons {
      text-align: center;
      padding: 20px 10px;
      background: white;
    }

    button {
      border: 0;
      padding: 13px 22px;
      margin: 5px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: #111;
      color: white;
    }

    .register {
      background: #d4af37;
      color: #111;
    }

    .logout {
      background: #c0392b;
      color: white;
    }

    .search {
      padding: 20px 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    .search input {
      max-width: 650px;
      display: block;
      margin: auto;
    }

    section {
      padding: 20px 15px;
    }

    h2 {
      text-align: center;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 700px;
      margin: auto;
    }

    .category {
      background: white;
      padding: 25px 10px;
      text-align: center;
      border-radius: 12px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .empty {
      background: white;
      max-width: 650px;
      margin: auto;
      padding: 30px 20px;
      text-align: center;
      border-radius: 12px;
      color: #777;
    }

    footer {
      margin-top: 30px;
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 10px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 15px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .close {
      background: #ddd;
      color: #222;
    }

    .submit {
      background: #111;
      color: white;
      width: 100%;
    }

    .forgot {
      display: block;
      text-align: center;
      margin: 12px 0;
      color: #8a6d00;
      font-weight: bold;
      cursor: pointer;
    }
